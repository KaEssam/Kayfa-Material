<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | LinkVault</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card">
        <div class="brand mb-1"><i class="bi bi-safe2"></i> LinkVault</div>
        <p class="text-secondary mb-4">Welcome back. Log in to your vault.</p>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              required
            />
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100">
            <span
              class="spinner-border spinner-border-sm d-none"
              id="submitSpinner"
            ></span>
            Log in
          </button>
        </form>

        <p class="text-center mt-4 mb-0 text-secondary">
          New here? <a href="register.html">Create an account</a>
        </p>
      </div>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
