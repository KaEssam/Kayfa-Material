<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | LinkVault</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card">
        <div class="brand mb-1"><i class="bi bi-safe2"></i> LinkVault</div>
        <p class="text-secondary mb-4">
          Create an account to start saving your links.
        </p>

        <!-- Success / error messages appear here -->
        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="registerForm" novalidate>
          <div class="row g-2">
            <div class="col-6 mb-3">
              <label for="firstName" class="form-label">First name</label>
              <input
                type="text"
                id="firstName"
                class="form-control"
                maxlength="20"
                required
              />
            </div>
            <div class="col-6 mb-3">
              <label for="lastName" class="form-label">Last name</label>
              <input
                type="text"
                id="lastName"
                class="form-control"
                maxlength="20"
                required
              />
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              class="form-control"
              maxlength="50"
              required
            />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              class="form-control"
              required
            />
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary w-100">
            <span
              class="spinner-border spinner-border-sm d-none"
              id="submitSpinner"
            ></span>
            Create account
          </button>
        </form>

        <p class="text-center mt-4 mb-0 text-secondary">
          Already have an account? <a href="login.html">Log in</a>
        </p>
      </div>
    </main>

    <script src="./js/app.js"></script>
  </body>
</html>
