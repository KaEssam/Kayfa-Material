<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmark | LinkVault</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md">
      <div class="container">
        <a class="navbar-brand brand" href="index.html"
          ><i class="bi bi-safe2"></i> LinkVault</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Bookmarks</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="notes.html">Notes</a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="text-secondary"
              ><i class="bi bi-person-circle"></i>
              <span id="userName">...</span></span
            >
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">
              Log out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- This page is opened as bookmark.html?id=5 → read the id from the URL -->
    <main class="container py-4" style="max-width: 760px">
      <a href="index.html" class="text-decoration-none text-secondary small"
        ><i class="bi bi-arrow-left"></i> Back to bookmarks</a
      >

      <div id="alertBox" class="alert d-none mt-3" role="alert"></div>

      <div id="loading" class="text-center py-5 d-none">
        <div class="spinner-border text-primary"></div>
      </div>

      <!-- Bookmark details -->
      <div class="item-card p-4 mt-3">
        <div class="d-flex justify-content-between align-items-start gap-2">
          <h3 id="bookmarkTitle" class="mb-1">Bookmark title</h3>
          <span id="bookmarkCategory" class="badge text-bg-light"
            >Category</span
          >
        </div>
        <a id="bookmarkUrl" href="#" target="_blank" class="card-url"
          >https://example.com</a
        >
      </div>

      <!-- Notes on this bookmark -->
      <h5 class="mt-4 mb-3">Notes</h5>

      <form id="noteForm" class="mb-3" novalidate>
        <textarea
          id="noteContent"
          class="form-control mb-2"
          rows="3"
          maxlength="1000"
          placeholder="Write a note about this link..."
          required
        ></textarea>
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-secondary"
            ><span id="charCount">0</span>/1000</small
          >
          <button type="submit" class="btn btn-primary btn-sm">Add note</button>
        </div>
      </form>

      <div id="emptyState" class="empty-state d-none">
        <i class="bi bi-journal"></i>
        No notes on this bookmark yet.
      </div>

      <!--
      Each note:
      <div class="item-card p-3 mb-2 d-flex gap-2">
        <p class="note-content mb-0 flex-grow-1">Note text</p>
        <button class="icon-btn danger delete-note" data-id="7"><i class="bi bi-trash"></i></button>
      </div>
    -->
      <div id="notesList"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
