<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookmarks | LinkVault</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-md">
      <div class="container">
        <a class="navbar-brand brand" href="index.html"
          ><i class="bi bi-safe2"></i> LinkVault</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Bookmarks</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="notes.html">Notes</a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="text-secondary"
              ><i class="bi bi-person-circle"></i>
              <span id="userName">...</span></span
            >
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">
              Log out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="row g-4">
        <!-- ================= SIDEBAR: CATEGORIES ================= -->
        <aside class="col-md-3">
          <div class="sidebar">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h6 class="mb-0 text-uppercase text-secondary small">
                Categories
              </h6>
              <button
                class="icon-btn"
                data-bs-toggle="modal"
                data-bs-target="#categoryModal"
                title="Add category"
              >
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>

            <!--
            Each category is an <li> like this (data-id = category id):
            <li class="list-group-item d-flex justify-content-between align-items-center" data-id="3">
              <span>Frontend</span>
              <span>
                <button class="icon-btn edit-category" data-id="3"><i class="bi bi-pencil"></i></button>
                <button class="icon-btn danger delete-category" data-id="3"><i class="bi bi-trash"></i></button>
              </span>
            </li>
            The first item "All" is fixed — keep it.
          -->
            <ul id="categoriesList" class="list-group">
              <li class="list-group-item active" data-id="">All bookmarks</li>
            </ul>
          </div>
        </aside>

        <!-- ================= MAIN: BOOKMARKS ================= -->
        <section class="col-md-9">
          <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
            <div class="flex-grow-1">
              <input
                type="search"
                id="searchInput"
                class="form-control"
                placeholder="Search bookmarks..."
              />
            </div>

            <div class="btn-group" role="group">
              <input
                type="radio"
                class="btn-check"
                name="statusFilter"
                id="filterAll"
                value="all"
                checked
              />
              <label class="btn btn-outline-primary" for="filterAll">All</label>

              <input
                type="radio"
                class="btn-check"
                name="statusFilter"
                id="filterFavorite"
                value="favorite"
              />
              <label class="btn btn-outline-primary" for="filterFavorite"
                ><i class="bi bi-star"></i> Favorites</label
              >

              <input
                type="radio"
                class="btn-check"
                name="statusFilter"
                id="filterArchived"
                value="archived"
              />
              <label class="btn btn-outline-primary" for="filterArchived"
                ><i class="bi bi-archive"></i> Archived</label
              >
            </div>

            <button
              id="addBookmarkBtn"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#bookmarkModal"
            >
              <i class="bi bi-plus-lg"></i> Add bookmark
            </button>
          </div>

          <div id="alertBox" class="alert d-none" role="alert"></div>

          <!-- Loading -->
          <div id="loading" class="text-center py-5 d-none">
            <div class="spinner-border text-primary"></div>
          </div>

          <!-- Empty state -->
          <div id="emptyState" class="empty-state d-none">
            <i class="bi bi-bookmark-plus"></i>
            No bookmarks yet. Add your first one.
          </div>

          <!--
          Each bookmark card looks like this (put it inside #bookmarksGrid):

          <div class="col-sm-6 col-lg-4">
            <div class="item-card p-3 d-flex flex-column">
              <div class="d-flex justify-content-between align-items-start mb-1">
                <h6 class="mb-0">Bookmark title</h6>
                <span class="badge text-bg-light">Category</span>
              </div>
              <a href="https://example.com" target="_blank" class="card-url mb-3">https://example.com</a>
              <div class="mt-auto d-flex gap-1">
                <button class="icon-btn toggle-favorite is-active" data-id="1" title="Favorite"><i class="bi bi-star-fill"></i></button>
                <button class="icon-btn toggle-archive" data-id="1" title="Archive"><i class="bi bi-archive"></i></button>
                <a class="icon-btn" href="bookmark.html?id=1" title="Notes"><i class="bi bi-journal-text"></i></a>
                <button class="icon-btn edit-bookmark ms-auto" data-id="1" title="Edit"><i class="bi bi-pencil"></i></button>
                <button class="icon-btn danger delete-bookmark" data-id="1" title="Delete"><i class="bi bi-trash"></i></button>
              </div>
            </div>
          </div>

          is-active on the star = favorite. Use bi-star-fill when favorite, bi-star when not.
        -->
          <div id="bookmarksGrid" class="row g-3"></div>
        </section>
      </div>
    </main>

    <!-- ================= MODAL: ADD / EDIT BOOKMARK ================= -->
    <div class="modal fade" id="bookmarkModal" tabindex="-1">
      <div class="modal-dialog">
        <form id="bookmarkForm" class="modal-content" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="bookmarkModalTitle">Add bookmark</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <!-- empty = add mode, has value = edit mode -->
            <input type="hidden" id="bookmarkId" />

            <div id="bookmarkFormAlert" class="alert alert-danger d-none"></div>

            <div class="mb-3">
              <label for="bookmarkUrl" class="form-label">URL</label>
              <input
                type="url"
                id="bookmarkUrl"
                class="form-control"
                placeholder="https://..."
                required
              />
            </div>
            <div class="mb-3">
              <label for="bookmarkTitle" class="form-label">Title</label>
              <input
                type="text"
                id="bookmarkTitle"
                class="form-control"
                maxlength="200"
                required
              />
            </div>
            <div class="mb-3">
              <label for="bookmarkCategory" class="form-label">Category</label>
              <!-- options: <option value="3">Frontend</option> -->
              <select id="bookmarkCategory" class="form-select" required>
                <option value="">Choose a category...</option>
              </select>
            </div>

            <!-- Only used in edit mode -->
            <div id="editOnlyFields" class="d-none">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="bookmarkFavorite"
                />
                <label class="form-check-label" for="bookmarkFavorite"
                  >Favorite</label
                >
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="bookmarkArchived"
                />
                <label class="form-check-label" for="bookmarkArchived"
                  >Archived</label
                >
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ================= MODAL: ADD / EDIT CATEGORY ================= -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <form id="categoryForm" class="modal-content" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="categoryModalTitle">New category</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="categoryId" />
            <div id="categoryFormAlert" class="alert alert-danger d-none"></div>
            <div class="mb-3">
              <label for="categoryName" class="form-label">Name</label>
              <input
                type="text"
                id="categoryName"
                class="form-control"
                maxlength="100"
                required
              />
            </div>
            <div class="mb-3">
              <label for="categoryDescription" class="form-label"
                >Description
                <span class="text-secondary">(optional)</span></label
              >
              <textarea
                id="categoryDescription"
                class="form-control"
                rows="2"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
