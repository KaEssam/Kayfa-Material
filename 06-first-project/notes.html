<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes | LinkVault</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md">
      <div class="container">
        <a class="navbar-brand brand" href="index.html"
          ><i class="bi bi-safe2"></i> LinkVault</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Bookmarks</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="notes.html">Notes</a>
            </li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <span class="text-secondary"
              ><i class="bi bi-person-circle"></i>
              <span id="userName">...</span></span
            >
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary">
              Log out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <input
          type="search"
          id="searchInput"
          class="form-control flex-grow-1"
          style="max-width: 320px"
          placeholder="Search notes..."
        />

        <!-- options: <option value="3">Frontend</option> -->
        <select
          id="categoryFilter"
          class="form-select"
          style="max-width: 220px"
        >
          <option value="">All categories</option>
        </select>

        <div class="form-check form-switch ms-1">
          <input class="form-check-input" type="checkbox" id="pinnedOnly" />
          <label class="form-check-label" for="pinnedOnly">Pinned only</label>
        </div>

        <button
          id="addNoteBtn"
          class="btn btn-primary ms-auto"
          data-bs-toggle="modal"
          data-bs-target="#noteModal"
        >
          <i class="bi bi-plus-lg"></i> New note
        </button>
      </div>

      <div id="alertBox" class="alert d-none" role="alert"></div>

      <div id="loading" class="text-center py-5 d-none">
        <div class="spinner-border text-primary"></div>
      </div>

      <div id="emptyState" class="empty-state d-none">
        <i class="bi bi-sticky"></i>
        No notes yet.
      </div>

      <!--
      Each note card:
      <div class="col-sm-6 col-lg-4">
        <div class="item-card p-3 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h6 class="mb-0">Note title</h6>
            <button class="icon-btn toggle-pin is-active" data-id="4" title="Pin"><i class="bi bi-pin-angle-fill"></i></button>
          </div>
          <p class="note-content mb-3">Note content...</p>
          <div class="mt-auto d-flex align-items-center gap-1">
            <span class="badge text-bg-light">Category</span>
            <button class="icon-btn edit-note ms-auto" data-id="4"><i class="bi bi-pencil"></i></button>
            <button class="icon-btn danger delete-note" data-id="4"><i class="bi bi-trash"></i></button>
          </div>
        </div>
      </div>

      Pinned: is-active + bi-pin-angle-fill. Not pinned: bi-pin-angle.
    -->
      <div id="notesGrid" class="row g-3"></div>
    </main>

    <!-- ================= MODAL: ADD / EDIT NOTE ================= -->
    <div class="modal fade" id="noteModal" tabindex="-1">
      <div class="modal-dialog">
        <form id="noteForm" class="modal-content" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="noteModalTitle">New note</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="noteId" />
            <div id="noteFormAlert" class="alert alert-danger d-none"></div>
            <div class="mb-3">
              <label for="noteTitle" class="form-label">Title</label>
              <input
                type="text"
                id="noteTitle"
                class="form-control"
                maxlength="100"
                required
              />
            </div>
            <div class="mb-3">
              <label for="noteContent" class="form-label">Content</label>
              <textarea
                id="noteContent"
                class="form-control"
                rows="5"
                maxlength="1000"
                required
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="noteCategory" class="form-label">Category</label>
              <select id="noteCategory" class="form-select" required>
                <option value="">Choose a category...</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-light" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
