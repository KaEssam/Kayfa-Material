<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        
    <input type="text" name="firstName" minlength="2" maxlength="20" title="firs tName" placeholder="eg.. ur first name">
    <input type="text" name="lastName" minlength="2" maxlength="20" title="last Name">

        <!-- email= example@mail.com -->
    <input type="email" name="email"  placeholder="example@mail.com">

    <input type="tel" pattern="[0-9]{11}" placeholder="01000000000">

    <label for="">Grediants</label>
    <input type="checkbox" name="cheese"> cheese
    <input type="checkbox" name="olives"> olives


    <input type="password">
    <input type="url">
    <input type="number" min="1" max="5">

    <!-- gender= male or female -->
    <input type="radio" name="gender" value="male"> male
    <input type="radio" name="gender" value="female"> female

    <input type="date">
    <input type="datetime">
    <input type="file">
    <input type="range">
    <select name="country">
        <option value="eg">egypt</option>
        <option value="syr">syria</option>
    </select>

    <button type="submit">save</button>
    </form>
    
</body>
</html>
